name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Fetch weekly news data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            -A "TradingCompanion/1.0" \
            -H "Origin: https://noahnjh.github.io" \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json \
            -o data/news.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4