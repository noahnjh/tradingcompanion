    <path d="M48 55 H638 M133 279 H254 M312 258 H589 M433 112 H526"/>
    <path d="M236 324 Q256 348 276 324" stroke="#246bff" stroke-width="2"/>
  </g>
  <path d="M255 282 H566 V323 H255 Z" fill="#91a9c8" opacity=".62"/>
  <path d="M545 248 L560 294 L586 188 L600 214 L622 54 L636 64" fill="none" stroke="#27a84a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#111" font-family="Arial, sans-serif" font-size="16">
    <text x="386" y="103">Buyers Induced</text>
    <text x="278" y="304" fill="#233246" font-size="14">Imbalance</text>
