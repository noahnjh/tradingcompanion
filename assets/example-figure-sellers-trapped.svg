<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 560" role="img" aria-labelledby="title desc">
  <title id="title">Sellers induced, sellers trapped</title>
  <desc id="desc">Price falls into an imbalance, induces sellers, then rises before reversing downward.</desc>
