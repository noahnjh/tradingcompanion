  <g fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 24 L34 117 L70 81 L100 138 L126 91 L149 159 L182 67 L207 188 L236 132 L255 330 L278 238 L305 319 L331 234 L365 296 L390 227 L407 289 L437 185 L490 300 L503 246"/>
    <path d="M70 81 H405 M182 66 H407 M235 330 H615 M407 285 H503"/>
  </g>
  <path d="M184 63 H532 V112 H184 Z" fill="#91a9c8" opacity=".62"/>
  <path d="M506 203 L523 132 L549 244 L565 224 L590 322 L604 313" fill="none" stroke="#ef3340" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#111" font-family="Arial, sans-serif" font-size="16">
    <text x="173" y="35">LB</text>
    <text x="218" y="91" fill="#233246" font-size="14">Imbalance</text>
    <text x="541" y="376">Sellers Trapped</text>
    <text x="438" y="510">Sellers Induced</text>
  </g>
</svg>